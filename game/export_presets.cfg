html/head_include="<meta name=\"theme-color\" content=\"#1a2332\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Rogue Dealership\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">\n<script>\n(function () {\n  // A phone takes the GPU away from an app left in the background, and the\n  // engine cannot get it back: all it does is alert, which an installed app has\n  // no reload button to answer. Catch it first, reload once the app is in front\n  // again, and the game picks the run straight back up (RunFile.RESUME_FLAG).\n  var flag = 'rd_resume';\n  var stamp = 'rd_reloaded_at';\n  function store(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }\n  function read(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }\n  function reload() { store(stamp, String(Date.now())); store(flag, '1'); location.reload(); }\n  function ask() {\n    var d = document.createElement('div');\n    d.textContent = 'Tap to get back to work';\n    d.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;'\n      + 'justify-content:center;background:#1a2332;color:#fff;font:600 28px sans-serif';\n    d.addEventListener('click', reload);\n    document.body.appendChild(d);\n  }\n  window.addEventListener('webglcontextlost', function (ev) {\n    ev.preventDefault();\n    ev.stopImmediatePropagation();\n    // Lost again straight after reloading for it: ask, never loop.\n    if (Date.now() - Number(read(stamp) || 0) < 15000) { ask(); return; }\n    if (document.visibilityState === 'visible') { reload(); return; }\n    document.addEventListener('visibilitychange', function () {\n      if (document.visibilityState === 'visible') { reload(); }\n    });\n  }, true);\n})();\n</script>"
